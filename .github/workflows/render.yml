name: Render video

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install fonts (fallback for math symbols and Bengali)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-noto-core

      - name: Check narration audio exists
        run: |
          if [ ! -f public/narration.mp3 ]; then
            echo "::error::public/narration.mp3 not found. Commit your ElevenLabs audio to public/narration.mp3"
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Render
        run: npm run render

      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
          if-no-files-found: error
          retention-days: 14
